[package]
name = "espnet-burn"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "ESPnet2 (VITS) text-to-speech inference ported to the Burn framework, with an Open JTalk frontend."

[dependencies]
burn = { version = "0.21", default-features = false, features = ["std"] }
regex = "1.3"
cxx = "1.0"
tar = "0.2"
flate2 = "1.0"
ureq = "3.0"
serde = "1.0"
yaml_serde = "0.10"
thiserror = "2.0"
burn-store = { version = "0.21", default-features = false, features = ["pytorch", "std"] }

[build-dependencies]
cxx-build = "1.0"

[dev-dependencies]
burn = { version = "0.21", default-features = false, features = ["wgpu", "flex"] }
