name: Release

# release ブランチが更新されたときに実行するリリースパイプライン。
#   1. フォーマットを行い、release ブランチへ push
#   2. 各 OS で build / test
#   3. 依存の最小バージョンでビルドできるか確認（コミットはしない）
#   4. バージョンをタグ付けし、main へマージ

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ------------------------------------------------------------------
  # 1) release ブランチの体裁を整える（cargo fmt）
  # ------------------------------------------------------------------
  prepare:
    name: Prepare (cargo fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # 更新後のコミットSHA （後続jobのcheckout先）
      sha: ${{ steps.commit.outputs.sha }}
      # Cargo.tomlのpackage.version（タグ名）
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(release): apply cargo fmt"
            git push origin HEAD:release
          else
            echo "No changes to commit."
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve version from Cargo.toml
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$version" ]; then
            echo "Cargo.toml から version を取得できませんでした" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

  # ------------------------------------------------------------------
  # 2) 各 OS でビルドとテスト
  # ------------------------------------------------------------------
  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout (prepared commit)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 報告のみ
      - name: Clippy
        run: cargo clippy --locked --all-targets
        continue-on-error: true

      - name: Test
        run: cargo test --locked -- --skip test_wgpu --skip test_flex --skip loads_model_from_checkpoint_and_config

  # ------------------------------------------------------------------
  # 3) 依存の最小バージョンでのビルド確認
  # ------------------------------------------------------------------
  minimal-versions:
    name: Minimal Versions Build (deps)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout (prepared commit)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: recursive

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly

      - name: Cache cargo (minimal-versions)
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-targets: false
          prefix-key: minimal-versions

      - name: Update to minimal versions
        run: cargo +nightly -Z direct-minimal-versions update

      # fixture がないためビルドのみ
      - name: Build (minimal versions)
        run: cargo build --all-targets

  # ------------------------------------------------------------------
  # 4) バージョンをタグ付けし、main へマージ
  # ------------------------------------------------------------------
  release:
    name: Tag & Merge to main
    needs:
      - prepare
      - build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (prepared commit)
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Create and push tag
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} already exists on origin; skipping tag creation."
          else
            git tag "${tag}"
            git push origin "${tag}"
            echo "Created tag ${tag}."
          fi

      - name: Merge release into main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-edit "${{ needs.prepare.outputs.sha }}"
          git push origin main
